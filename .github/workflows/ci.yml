name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

       - name: Generate Prisma Client
         run: pnpm --filter server prisma:generate
         env:
           DATABASE_URL: file:./test.db

      - name: Prepare test database
        run: pnpm --filter server test:prepare

      - name: Run tests
        run: pnpm test

      - name: Lint client
        run: pnpm --filter client lint

      - name: Build
        run: pnpm build
